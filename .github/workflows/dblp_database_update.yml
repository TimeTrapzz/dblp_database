name: DBLP Database Update

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/dblp_database_update.yml'
      - 'scripts/convert.py'
      - 'tests/test_convert.py'
  schedule:
    - cron: '17 3 * * 1'  # 每周一 UTC 03:17，避开整点高峰
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: write

concurrency:
  group: dblp-database-update
  cancel-in-progress: false

jobs:
  update-dblp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: 
      name: production
    env:
      PGPASSWORD: ${{ secrets.DB_PASSWORD }}
    
    steps:
      - uses: actions/checkout@v4
      
      # 1. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      # 2. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml tqdm

      - name: Test converter
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Setup PostgreSQL
        uses: tj-actions/install-postgresql@v3
        with:
          postgresql-version: 16

      # 3. 下载和处理 DBLP 数据
      - name: Download and process DBLP
        run: |
          wget --no-verbose --show-progress https://dblp.org/xml/dblp.dtd
          wget --no-verbose --show-progress https://dblp.org/xml/dblp.xml.gz
          wget --no-verbose --show-progress https://dblp.org/xml/dblp.xml.gz.md5
          
      # 4. 转换为 SQL
      - name: Convert to SQL
        run: |
          python scripts/convert.py --dtd_file dblp.dtd --xml_file dblp.xml.gz --md5_file dblp.xml.gz.md5 --output_sql_file dblp.sql
          
      # 5. 导入到 PostgreSQL
      - name: Import to PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -h ${{ secrets.DB_HOST }} -p 5432 -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -f dblp.sql
          
      # 6. 记录数据新鲜度，同时保持 scheduled workflow 处于活跃状态
      - name: Record successful refresh
        run: |
          entry_count=$(psql -v ON_ERROR_STOP=1 -h ${{ secrets.DB_HOST }} -p 5432 -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -Atc 'SELECT COUNT(*) FROM dblp_entries')
          source_md5=$(cut -d ' ' -f 1 dblp.xml.gz.md5)
          mkdir -p status
          printf '{\n  "updated_at": "%s",\n  "source_md5": "%s",\n  "entry_count": %s\n}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$source_md5" "$entry_count" \
            > status/dblp-update.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/dblp-update.json
          git commit -m 'chore: record DBLP refresh [skip ci]' || exit 0
          git pull --rebase origin master
          git push origin HEAD:master

      # 7. 清理临时文件
      - name: Cleanup
        run: |
          rm -f dblp.xml.gz dblp.xml.gz.md5 dblp.dtd dblp.sql
