name: DBLP Database Update

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/dblp_database_update.yml'
      - 'scripts/**'
      - 'tests/**'
  schedule:
    - cron: '17 3 * * 1'  # 每周一 UTC 03:17，避开整点高峰
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: write

concurrency:
  group: dblp-database-update
  cancel-in-progress: false

jobs:
  update-dblp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: 
      name: production
    env:
      PGPASSWORD: ${{ secrets.DB_PASSWORD }}
    
    steps:
      - uses: actions/checkout@v4
      
      # 1. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      # 2. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml tqdm

      - name: Test converter
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Setup PostgreSQL
        uses: tj-actions/install-postgresql@v3
        with:
          postgresql-version: 16

      # 3. 下载和处理 DBLP 数据
      - name: Download and process DBLP
        id: download
        run: python scripts/download.py
          
      # 4. 转换为 SQL
      - name: Convert to SQL
        if: steps.download.outputs.changed == 'true'
        run: |
          python scripts/convert.py --dtd_file dblp.dtd --xml_file dblp.xml.gz --md5_file dblp.xml.gz.md5 --output_sql_file dblp.sql
          
      # 5. 导入到 PostgreSQL
      - name: Import to PostgreSQL
        if: steps.download.outputs.changed == 'true'
        run: |
          psql -v ON_ERROR_STOP=1 -h ${{ secrets.DB_HOST }} -p 5432 -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -f dblp.sql
          
      # 6. 分开记录实际导入时间和检查时间，保持 scheduled workflow 活跃
      - name: Record refresh status
        env:
          DATA_CHANGED: ${{ steps.download.outputs.changed }}
        run: |
          if [ "$DATA_CHANGED" = true ]; then
            entry_count=$(psql -v ON_ERROR_STOP=1 -h ${{ secrets.DB_HOST }} -p 5432 -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -Atc 'SELECT COUNT(*) FROM dblp_entries')
            python scripts/download.py --record-status --entry-count "$entry_count"
          else
            python scripts/download.py --record-status
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/dblp-update.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record DBLP refresh [skip ci]'
          git pull --rebase origin master
          git push origin HEAD:master

      # 7. 清理临时文件
      - name: Cleanup
        if: always()
        run: |
          rm -f dblp.xml.gz dblp.xml.gz.md5 dblp.dtd dblp.sql dblp-download.json
